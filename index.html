<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110d"><title>Bear-Si GPTudio 16.2</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><div class="bear">🐻</div><div><b>Bear-Si GPTudio</b><span>GREEN CORE 16.2</span></div></div><button id="themeBtn" class="icon">☼</button></header><main><section class="toolbar"><button id="addBtn" class="primary">＋ Añadir audio</button><input id="fileInput" type="file" accept="audio/*" multiple hidden><button id="newBtn">Nuevo</button><button id="saveBtn">Guardar proyecto</button><button id="loadBtn">Cargar proyecto</button><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label></section><section class="transport"><button id="rewind">⏮</button><button id="play" class="play">▶</button><button id="stop">■</button><div class="time"><span id="current">00:00</span><span>/</span><span id="duration">00:00</span></div><input id="master" type="range" min="0" max="1" step=".01" value=".9"><span>MASTER <b id="masterValue">90%</b></span><button id="loop">LOOP</button></section><section class="timeline"><div id="ruler">0:00</div><div id="playhead"></div></section><section id="tracks" class="tracks"><div class="empty">Añade audios para crear tu sesión.<br><small>16.2 guarda los archivos dentro del proyecto.</small></div></section><section class="status"><span id="status">Listo. Persistencia local con IndexedDB preparada.</span><span id="trackCount">0 pistas</span></section></main><script src="app.js"></script></body></html>
