<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110d"><title>Bear-Si GPTudio 16.3</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><div class="bear">🐻</div><div><b>Bear-Si GPTudio</b><span>16.3 — REGIONS</span></div></div><button id="themeBtn" class="icon">☼</button></header><main><section class="toolbar"><button id="addBtn" class="primary">＋ Añadir audio</button><input id="fileInput" type="file" accept="audio/*" multiple hidden><button id="newBtn">Nuevo</button><button id="saveBtn">Guardar proyecto</button><button id="loadBtn">Cargar proyecto</button><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label><button id="snapBtn" class="snap-off">🔴 SNAP</button></section><section class="transport"><button id="rewind">⏮</button><button id="play" class="play">▶</button><button id="stop">■</button><div class="time"><span id="current">00:00</span><span>/</span><span id="duration">00:00</span></div><input id="master" type="range" min="0" max="1" step=".01" value=".9"><span>MASTER <b id="masterValue">90%</b></span><button id="loop">LOOP</button></section><section class="timeline-container"><div class="timeline-header"><div class="ruler-track"></div><div id="ruler" class="ruler">0:00</div><div id="gridOverlay" class="grid-overlay"></div></div><div id="timelineBody" class="timeline-body"><div id="playhead" class="playhead"></div></div></section><section class="layout-main"><div class="timeline-section"><section id="tracksTimeline" class="tracks-timeline"></section></div><div class="sidebar"><div class="markers-panel"><h3>🎯 Marcadores</h3><div id="markersList" class="markers-list"></div><button id="newMarkerBtn" class="secondary">+ Nuevo marcador</button></div><div class="region-props"><h3>📍 Región Seleccionada</h3><div id="regionProps" class="props-content"><p style="color: var(--muted)">Selecciona una región</p></div></div></section></section><section class="status"><span id="status">Listo. Regiones, marcadores y snap BPM preparados.</span><span id="trackCount">0 pistas</span></section></main><script src="timeline-visual.js"></script><script src="waveform.js"></script><script src="regions-ui.js"></script><script src="markers-ui.js"></script><script src="snap.js"></script><script src="app.js"></script></body></html>
